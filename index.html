<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a0d881">
  <meta name="description" content="なでる、つつく、ほっぺをつまむ。それだけのお部屋。">
  <title>ちいかわ おせわルーム</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23a0d881'/%3E%3Cellipse cx='20' cy='22' rx='15' ry='12' fill='white' stroke='%23756b53' stroke-width='2'/%3E%3Ccircle cx='14' cy='21' r='2'/%3E%3Ccircle cx='26' cy='21' r='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="game" aria-label="ちいかわ おせわルーム">
  <header><div class="brand"><span class="small">ちいかわ</span><h1>おせわルーム</h1></div><span class="version">Ver. 1.0.3</span><button id="sound" class="sound" aria-label="音をオンにする" aria-pressed="false">音 OFF</button></header>
  <div class="status"><span>きげん <b id="mood">よい</b></span><span>なかよし <b id="count">0</b></span></div>
  <section class="room" aria-label="ベッドと机と窓のある部屋">
   <canvas id="game" tabindex="0" role="application" aria-label="ちいかわをお世話。どの部位でもドラッグすると伸びます。キーボードでは左右の矢印でほっぺ、上矢印でなでる、スペースでつつく。"></canvas>
   <div id="loading" class="loading" role="status">おへやに移動中…</div>
   <div class="hint" id="hint">すきなところを つまんで ひっぱる</div>
   <div id="reaction" class="reaction" aria-live="polite"></div>
   <div class="room-label">マイルーム</div>
  </section>
  <nav class="controls" aria-label="お世話する"><button id="pet"><span aria-hidden="true">♡</span>なでる</button><button id="poke"><span aria-hidden="true">☝</span>つつく</button><button id="reset"><span aria-hidden="true">↻</span>はじめから</button></nav>
  <footer><span>耳も 手足も どこでもつまめます</span><small>非公式・ファン制作</small></footer>
 </main>
 <script type="module" src="game.js"></script>
</body>
</html>
